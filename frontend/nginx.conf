server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx drops inherited add_header directives as soon as a location adds
    # its own, so the security headers live in a snippet every block includes.
    include /etc/nginx/conf.d/security-headers.inc;

    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k;
    }

    # Vite emits content-hashed filenames under assets/, so they can be cached
    # forever; index.html must always be revalidated so it picks up new hashes.
    location ~ ^/(?:[^/]+/)?assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
