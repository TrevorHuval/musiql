name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: musiql
          POSTGRES_PASSWORD: musiql
          POSTGRES_DB: musiql
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U musiql -d musiql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MusiQL.sln

      - name: Build
        run: dotnet build MusiQL.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MusiQL.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MusiQL.Api/Dockerfile
          push: false
          tags: musiql-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: musiql-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MusiQL.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/trevorhuval/musiql-api:latest
            ghcr.io/trevorhuval/musiql-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web image (served under /musiql)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/musiql/
          tags: |
            ghcr.io/trevorhuval/musiql-web:latest
            ghcr.io/trevorhuval/musiql-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build and push ETL image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MusiQL.Etl/Dockerfile
          push: true
          tags: |
            ghcr.io/trevorhuval/musiql-etl:latest
            ghcr.io/trevorhuval/musiql-etl:${{ github.sha }}
          cache-from: type=gha,scope=etl
          cache-to: type=gha,mode=max,scope=etl
